<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="墨愚课程详情：课程介绍、学习收获、课程大纲与适合人群。">
  <title>课程详情 — 墨愚</title>
  <link rel="icon" href="assets/moyu-wordmark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="courses.css">
  <link rel="stylesheet" href="course-detail.css">
  <script defer src="account-core.js"></script>
  <script defer src="course-data.js"></script>
  <script defer src="courses.js"></script>
</head>
<body class="course-page course-detail-page">
  <a class="skip-link" href="#main">跳转至课程介绍</a>
  <header class="course-detail-header">
    <a class="text-link" href="courses.html">← 全部课程</a>
    <nav aria-label="主导航"><a class="text-link" href="orders.html">购买记录</a></nav>
    <a href="account.html" class="account-link" data-account-link aria-label="登录或注册"><span class="account-avatar" aria-hidden="true">墨</span><span class="account-link-name">登录</span></a>
  </header>
  <main id="main" class="course-detail-main" tabindex="-1">
    <section id="course-error" class="course-empty" role="alert" hidden><h1>没有找到这门课程。</h1><p>课程链接无效或课程已移除，请返回课程列表重新选择。</p><a class="button button-dark" href="courses.html">浏览全部课程 →</a></section>
    <div data-course-surface hidden>
      <section class="course-detail-heading" aria-labelledby="course-title">
        <h1 id="course-title" data-course-title></h1>
        <p class="course-detail-intro" data-course-intro></p>
      </section>
      <section class="course-instructor" aria-labelledby="instructor-label" hidden>
        <h2 id="instructor-label">授课老师</h2>
        <div class="course-instructor-avatar"></div>
        <p id="instructor-name" class="course-instructor-name"></p>
        <p id="instructor-intro" class="course-instructor-intro"></p>
      </section>
      <dl class="course-summary" aria-label="课程信息"></dl>
      <article class="course-story" aria-label="课程介绍"></article>
      <aside class="course-purchase-bar" aria-label="购买课程"><div class="course-purchase-inner"><p class="course-price"><span data-course-price></span></p><a class="button button-dark" data-course-checkout>立即购买</a></div></aside>
    </div>
    <noscript><p class="course-notice">请启用 JavaScript 后刷新，以加载课程详情。</p></noscript>
  </main>
</body>
</html>

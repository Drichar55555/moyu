<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="description" content="墨愚课程详情：课程介绍、学习收获、课程大纲与适合人群。">
  <title>课程详情 — 墨愚</title>
  <link rel="icon" href="assets/moyu-wordmark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="courses.css">
  <script defer src="account-core.js"></script>
  <script defer src="course-data.js"></script>
  <script defer src="courses.js"></script>
</head>
<body class="course-page">
  <a class="skip-link" href="#main">跳转至课程介绍</a>
  <header class="course-header container">
    <a class="brand" href="index.html" aria-label="墨愚首页"><span class="logo-type brand-wordmark">墨愚</span></a>
    <nav aria-label="主导航"><a href="courses.html">全部课程</a><a href="orders.html">购买记录</a></nav>
    <a href="account.html" class="account-link" data-account-link aria-label="登录或注册"><span class="account-avatar" aria-hidden="true">墨</span><span class="account-link-name">登录</span></a>
  </header>
  <main id="main" class="container" tabindex="-1">
    <section id="course-error" class="course-empty" role="alert" hidden><h1>没有找到这门课程。</h1><p>课程链接无效或课程已移除，请返回课程列表重新选择。</p><a class="button button-dark" href="courses.html">浏览全部课程 →</a></section>
    <div data-course-surface hidden>
      <section class="course-hero" aria-labelledby="course-title">
        <div class="course-intro"><h1 id="course-title" data-course-title></h1><p class="course-lead" data-course-subtitle></p><p class="course-muted" data-course-description></p><div class="course-meta"><span data-course-format></span></div><div class="course-actions"><a class="button button-dark" data-course-checkout>立即购买</a><a class="text-link" href="#syllabus" data-course-syllabus-action>查看大纲</a></div></div>
        <div class="course-detail-image"><img data-course-image width="640" height="480" alt=""></div>
      </section>
      <nav class="course-anchor-nav" aria-label="课程内容导航"><a href="#teaching" hidden>课程安排</a><a href="#outcomes">学习收获</a><a href="#syllabus" data-course-syllabus-label>课程大纲</a><a href="#audience">适合人群</a></nav>
      <div class="course-body-layout">
        <div class="course-content">
          <section id="teaching" class="course-section" aria-labelledby="teaching-title" hidden><h2 id="teaching-title">课程安排</h2><dl class="course-facts" id="course-facts"></dl><p class="course-muted" id="teacher-bio"></p></section>
          <section id="outcomes" class="course-section" aria-labelledby="outcomes-title"><h2 id="outcomes-title">学习收获</h2><div class="course-outcomes"></div></section>
          <section id="syllabus" class="course-section" aria-labelledby="syllabus-title"><h2 id="syllabus-title">课程大纲</h2><div class="course-lessons"></div></section>
          <section id="audience" class="course-section" aria-labelledby="audience-title"><h2 id="audience-title">适合人群</h2><ul class="course-list" id="course-audience"></ul></section>
        </div>
        <aside class="course-enroll" aria-label="购买课程"><p class="course-price"><span data-course-price></span></p><a class="button button-dark" data-course-checkout>立即购买</a></aside>
      </div>
    </div>
    <noscript><p class="course-notice">请启用 JavaScript 后刷新，以加载课程详情。</p></noscript>
  </main>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed"><title>购买记录 — 墨愚</title>
  <link rel="icon" href="assets/moyu-wordmark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="account.css"><link rel="stylesheet" href="courses.css">
  <script defer src="account-core.js"></script><script defer src="payment-client.js"></script><script defer src="orders.js"></script>

<body class="course-page">
